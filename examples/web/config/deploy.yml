# Every app on a host shares one kamal-proxy, so all of them must use the same proxy.run values.
service: example-web
image: example/example-web
registry:
  server: ghcr.io
  username: example
  password: [KAMAL_REGISTRY_PASSWORD]
builder:
  arch: amd64
ssh:
  user: root
servers:
  web:
    hosts: []
proxy:
  # Caddy terminates TLS in front of kamal-proxy.
  ssl: false
  app_port: 3000
  forward_headers: true
  healthcheck:
    path: /healthz
  run:
    http_port: 8080
    https_port: 8443
    metrics_port: 9090
retain_containers: 3
deploy_timeout: 300
