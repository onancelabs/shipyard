service: example-api
image: example/example-api
registry:
  server: ghcr.io
  username: example
  password: [KAMAL_REGISTRY_PASSWORD]
builder:
  arch: amd64
ssh:
  user: root
servers:
  api:
    hosts: []
    options:
      # Joins the network Shipyard creates, so Postgres and Redis resolve by container name in dev.
      network: example
proxy:
  ssl: false
  app_port: 3000
  forward_headers: true
  healthcheck:
    path: /healthz
  run:
    http_port: 8080
    https_port: 8443
    metrics_port: 9090
env:
  secret: [DATABASE_URL, REDIS_URL]
retain_containers: 3
deploy_timeout: 300
