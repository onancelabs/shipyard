# The monitoring node, shared by this project's environments. Reachable over the tailnet only.
shipyard_project: example
shipyard_env: mon
shipyard_provider: digitalocean
shipyard_exposure: private
shipyard_region: nyc3
shipyard_network_cidr: 10.40.0.0/16
# Grafana gets a name in the dev zone, pointing at the node's tailnet address.
shipyard_domain: example-dev.com
shipyard_dns_names: [grafana]
shipyard_acme_email: ops@example-dev.com

shipyard_servers:
  - name: main
    roles: [mon, proxy]
    size: s-2vcpu-4gb

caddy_upstream: 127.0.0.1:3000
