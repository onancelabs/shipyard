- name: Fetch Cloudflare's published IP ranges
  ansible.builtin.uri:
    url: https://www.cloudflare.com/ips-{{ item }}
    return_content: true
  loop: [v4, v6]
  register: cloudflare_lists

- name: Keep the ranges
  ansible.builtin.set_fact:
    shipyard_cloudflare_ips: "{{ cloudflare_lists.results | map(attribute='content') | map('split') | flatten | select | list }}"

- name: Refuse an empty or malformed list
  ansible.builtin.assert:
    that:
      - cloudflare_lists.results | map(attribute='content') | map('split') | map('length') | min > 0
      - shipyard_cloudflare_ips | reject('match', '^[0-9a-fA-F:.]+/[0-9]{1,3}$') | list | length == 0
    fail_msg: Cloudflare's IP list came back empty or malformed, so 80 and 443 can't be limited to Cloudflare.
    quiet: true
